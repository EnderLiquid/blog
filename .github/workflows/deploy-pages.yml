name: 部署 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 缓存固定版本的 Merman 工具
        uses: actions/cache@v4
        with:
          path: .data/tools/merman
          key: merman-cli-v0.8.0-alpha.3-${{ runner.os }}-${{ runner.arch }}-a20d2d9d47a6f1d9ff44d8e1de8c5119833f80f3115c4a5d45188202555fb06f

      - name: 缓存静态图表资产
        uses: actions/cache@v4
        with:
          path: .data/diagram-assets
          key: diagram-assets-v3-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/diagrams/**', 'shared/content/diagram*.ts', 'shared/content/frontmatter.ts', 'shared/content/article-image.ts', 'app/assets/css/tokens.css', 'content/posts/**/*.md') }}
          restore-keys: |
            diagram-assets-v3-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/diagrams/**', 'shared/content/diagram*.ts', 'shared/content/frontmatter.ts', 'shared/content/article-image.ts', 'app/assets/css/tokens.css') }}-

      - name: 格式检查
        run: npm run format:check

      - name: 单元测试
        run: npm run test:unit

      - name: 生成并校验站点资源清单
        run: npm run site:manifest

      - name: 类型检查
        run: npm run typecheck

      - name: 生成静态网站与搜索索引
        run: npm run generate

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
